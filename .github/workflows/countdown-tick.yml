name: Icon countdown checker

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: icon-countdown
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - id: run
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: python updater.py

      - if: always()
        run: |
          git config user.name "icon-countdown-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f state.json ] || exit 0
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Update countdown status [skip ci]"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && exit 0; sleep 4; done
          exit 1

      - if: always() && steps.run.outputs.active == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable countdown-tick.yml --repo "${{ github.repository }}" || true
